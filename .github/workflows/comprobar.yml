name: Comprobar

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: comprobar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comprobar:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Bajar el repositorio
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Pruebas y compilación
        run: node scripts/comprobar.mjs
